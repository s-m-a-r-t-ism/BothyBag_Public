# Publishes the BothyBag web app (web/) to GitHub Pages.
#
# Runs when the web app or the bothy data changes, and once a day to refresh
# the MBA news (browsers cannot read the MBA feed themselves).
#
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".

name: Publish web app

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "app/src/main/assets/bothies.json"
      - "scripts/build_web.py"
      - "scripts/fetch_news.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build web app
        run: python3 scripts/build_web.py --out dist-web

      - name: Fetch MBA news
        run: >
          python3 scripts/fetch_news.py
          --out dist-web/data/news.json
          --fallback-url "${{ steps.pages.outputs.base_url }}/data/news.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

      - id: deployment
        uses: actions/deploy-pages@v4
